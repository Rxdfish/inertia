name: Rotate black hole GIF

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (at :17 to avoid the busy top of the hour)
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick a different random variant
        run: |
          current=$(sha1sum Images/blackhole.gif 2>/dev/null | cut -d' ' -f1 || true)
          for i in 1 2 3 4 5; do
            pick=$(ls Images/variants/*.gif | shuf -n 1)
            [ "$(sha1sum "$pick" | cut -d' ' -f1)" != "$current" ] && break
          done
          echo "Picked $pick"
          cp "$pick" Images/blackhole.gif

      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Images/blackhole.gif
          git diff --cached --quiet && exit 0
          git commit -m "Rotate black hole GIF"
          git push
